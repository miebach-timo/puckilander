<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<title>Puckilander</title>

<style>
/* ── Theme tokens ────────────────────────────────────
   :root holds the original rose/violet season. A second season only overrides
   these values in the body[data-season="…"] block below — no rule outside this
   section may hardcode a season colour, or switching seasons will leave a
   stray pink (or green) behind. Gradient geometry lives in the token too, so
   a theme swaps colours without redesigning the aurora composition. */
:root {
  --deep:   #3D0040;
  --ink:    #4A1855;
  --label-rgb: 138,50,118;

  --sky-layers:
    radial-gradient(ellipse 70% 55% at 12% 28%,  rgba(255,175,225,.90) 0%, transparent 58%),
    radial-gradient(ellipse 80% 58% at 88% 10%,  rgba(175,95,255,.80)  0%, transparent 54%),
    radial-gradient(ellipse 58% 72% at 50% 98%,  rgba(240,125,210,.85) 0%, transparent 52%),
    radial-gradient(ellipse 92% 38% at 58% 52%,  rgba(195,145,255,.55) 0%, transparent 58%),
    radial-gradient(ellipse 42% 62% at 22% 78%,  rgba(255,155,215,.68) 0%, transparent 50%),
    radial-gradient(ellipse 52% 44% at 82% 72%,  rgba(155,75,238,.52)  0%, transparent 50%),
    linear-gradient(148deg, rgba(248,196,232,.72) 0%, rgba(210,138,246,.72) 25%, rgba(158,88,224,.72) 50%, rgba(212,104,196,.72) 72%, rgba(240,152,216,.72) 100%);
  --glow-soft: rgba(255,200,240,.18);

  --header-veil: rgba(150,45,190,.38);
  --title-glow:  0 0 22px rgba(255,110,199,.95), 0 0 52px rgba(200,100,255,.60), 0 2px 9px rgba(80,0,100,.50);
  --pw-title-glow: 0 0 22px rgba(255,110,199,.9), 0 0 52px rgba(200,100,255,.6);
  --pw-error-color: rgba(255,220,240,.9);

  --ring-gradient: conic-gradient(from 0deg,
    #FF6EC7, #FFB8EA, #C77DFF, #E8A0FF, #FF6EC7, #FFB8EA, #C77DFF, #FF6EC7);
  --ring-glow: 0 0 18px rgba(255,110,199,.65), 0 0 42px rgba(200,120,255,.40), 0 0 70px rgba(200,120,255,.18);

  --card-front-bg: linear-gradient(148deg,
    rgba(248,225,255,.97) 0%, rgba(255,205,243,.93) 50%, rgba(235,200,255,.95) 100%);
  --card-back-bg: linear-gradient(148deg, rgba(255,253,255,.99) 0%, rgba(255,225,252,.93) 100%);
  --card-shadow: 0 20px 52px rgba(155,55,180,.28), 0 4px 14px rgba(120,40,160,.14), inset 0 1.5px 0 rgba(255,255,255,1);
  --icon-glow: drop-shadow(0 0 16px rgba(200,100,220,.55));
  --counter-shadow: 0 1px 4px rgba(120,40,160,.5);
}

/* Season 2 — jade / sage. Same geometry and alphas as above, green hues.
   ponytail: data-season sits on <html>, NOT <body> — `html` paints the canvas
   behind the safe-areas, so a --deep override scoped to body would leave the
   old purple showing through the iOS standalone seam. */
:root[data-season="jade"] {
  --deep: #06302A;
  --ink:  #14342C;
  --label-rgb: 26,92,74;

  --sky-layers:
    radial-gradient(ellipse 70% 55% at 12% 28%,  rgba(150,235,205,.90) 0%, transparent 58%),
    radial-gradient(ellipse 80% 58% at 88% 10%,  rgba(90,205,200,.80)  0%, transparent 54%),
    radial-gradient(ellipse 58% 72% at 50% 98%,  rgba(110,215,170,.85) 0%, transparent 52%),
    radial-gradient(ellipse 92% 38% at 58% 52%,  rgba(150,215,190,.55) 0%, transparent 58%),
    radial-gradient(ellipse 42% 62% at 22% 78%,  rgba(160,230,195,.68) 0%, transparent 50%),
    radial-gradient(ellipse 52% 44% at 82% 72%,  rgba(58,175,150,.52)  0%, transparent 50%),
    linear-gradient(148deg, rgba(226,246,234,.72) 0%, rgba(168,225,200,.72) 25%, rgba(88,186,160,.72) 50%, rgba(122,206,172,.72) 72%, rgba(178,232,206,.72) 100%);
  --glow-soft: rgba(200,245,225,.18);

  --header-veil: rgba(20,120,95,.38);
  --title-glow:  0 0 22px rgba(90,220,180,.95), 0 0 52px rgba(140,225,190,.60), 0 2px 9px rgba(0,58,44,.50);
  --pw-title-glow: 0 0 22px rgba(90,220,180,.9), 0 0 52px rgba(140,225,190,.6);
  --pw-error-color: rgba(220,255,238,.9);

  --ring-gradient: conic-gradient(from 0deg,
    #3FC79A, #A7E8C8, #6FB89A, #C9E8D4, #3FC79A, #A7E8C8, #6FB89A, #3FC79A);
  --ring-glow: 0 0 18px rgba(63,199,154,.65), 0 0 42px rgba(120,210,175,.40), 0 0 70px rgba(120,210,175,.18);

  --card-front-bg: linear-gradient(148deg,
    rgba(233,250,241,.97) 0%, rgba(203,238,220,.93) 50%, rgba(214,242,228,.95) 100%);
  --card-back-bg: linear-gradient(148deg, rgba(252,255,253,.99) 0%, rgba(216,242,229,.93) 100%);
  --card-shadow: 0 20px 52px rgba(20,110,85,.28), 0 4px 14px rgba(15,90,70,.14), inset 0 1.5px 0 rgba(255,255,255,1);
  --icon-glow: drop-shadow(0 0 16px rgba(70,195,155,.55));
  --counter-shadow: 0 1px 4px rgba(15,90,70,.5);
}

*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
html, body {
  /* ponytail: NOT height:100% — that collapses the iOS standalone ICB and the
     fixed .sky stops covering the safe-areas (notch/home-indicator), leaving a
     seam. 100vh under viewport-fit=cover = full physical screen incl. insets. */
  min-height: 100vh; overflow: hidden;
  overscroll-behavior: none;
  background: var(--deep); /* fallback behind the aurora; no camouflage needed */
  font-family: Georgia, 'Times New Roman', serif;
  touch-action: none;
}

/* ── Aurora sky ─────────────────────────────────── */
.sky {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  background: var(--sky-layers);
  animation: sky-breath 14s ease-in-out infinite alternate;
}
@keyframes sky-breath {
  from { filter: brightness(1)    saturate(1)    hue-rotate(0deg); }
  to   { filter: brightness(1.07) saturate(1.14) hue-rotate(11deg); }
}

/* ── Clouds ─────────────────────────────────────── */
.clouds { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.cloud  { position: absolute; background: rgba(255,255,255,.20); filter: blur(42px); }
.ca { width:390px; height:210px; top:-1%;   left:-8%;  border-radius:55% 65% 42% 72%/62% 42% 72% 52%; animation:da 22s -4s  ease-in-out infinite; }
.cb { width:470px; height:250px; top:50%;   right:-16%;border-radius:62% 42% 62% 42%/42% 62% 42% 62%; animation:db 28s -12s ease-in-out infinite; }
.cc { width:265px; height:155px; top:14%;   right:10%; border-radius:72% 32% 62% 52%/52% 62% 42% 72%; animation:da 18s -8s  ease-in-out infinite; }
.cd { width:415px; height:218px; bottom:-1%;left:6%;   border-radius:42% 72% 52% 62%/72% 52% 62% 42%; animation:db 24s -18s ease-in-out infinite; }
.ce { width:208px; height:125px; top:64%;   left:26%;  border-radius:62% 52% 42% 72%/52% 42% 62% 52%; animation:da 20s -6s  ease-in-out infinite; }
.cglow { width:500px; height:300px; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(ellipse, var(--glow-soft) 0%, transparent 70%); filter:blur(65px); animation:gp 9s ease-in-out infinite alternate; }
@keyframes da { 0%,100%{transform:translate(0,0)} 22%{transform:translate(19px,-17px)} 46%{transform:translate(9px,8px)} 72%{transform:translate(-15px,-11px)} }
@keyframes db { 0%,100%{transform:translate(0,0)} 26%{transform:translate(-22px,13px)} 52%{transform:translate(11px,-9px)} 78%{transform:translate(16px,11px)} }
@keyframes gp { from{transform:translate(-50%,-50%) scale(1);opacity:.6} to{transform:translate(-50%,-50%) scale(1.18);opacity:1} }

/* ── Sparkles ────────────────────────────────────── */
.sparkles { position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
@keyframes rise {
  0%   { opacity:0; transform:translateY(0)    scale(0)  rotate(0deg); }
  12%  { opacity:1; transform:translateY(-9px) scale(1)  rotate(15deg); }
  88%  { opacity:.5; transform:translateY(-72px) scale(.5) rotate(48deg); }
  100% { opacity:0; transform:translateY(-92px) scale(0) rotate(64deg); }
}

/* ── Header ──────────────────────────────────────── */
.header {
  position:fixed; top:0; left:0; right:0; z-index:30;
  padding: calc(env(safe-area-inset-top,0px) + 22px) 24px 16px;
  text-align:center;
  background:linear-gradient(to bottom, var(--header-veil) 0%, transparent 100%);
}
.header-name {
  font-size:clamp(1.55rem,6.5vw,2rem); color:#fff; letter-spacing:.1em;
  text-shadow: var(--title-glow);
}
.header-date {
  font-size:.72rem; color:rgba(255,255,255,.75); letter-spacing:.22em;
  text-transform:uppercase; font-family:'Trebuchet MS',sans-serif; margin-top:5px;
}

/* ── Season picker ───────────────────────────────────
   Deliberately not a native <select>: the iOS picker wheel can't be styled and
   would break the glass look. Colours are white-alpha only, so the pill reads
   correctly on every season background without needing theme tokens. */
.season-picker {
  position: relative; display: inline-block; margin-top: 9px;
  touch-action: manipulation; /* body sets touch-action:none — re-enable taps */
}
.season-btn {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,.18);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.44); border-radius: 50px;
  padding: 6px 14px;
  font-family: 'Trebuchet MS', sans-serif; font-size: .7rem;
  letter-spacing: .1em; color: rgba(255,255,255,.92);
  text-shadow: var(--counter-shadow);
  cursor: pointer; white-space: nowrap;
  transition: background .2s;
}
.season-btn:active { background: rgba(255,255,255,.32); }
.season-caret { font-size: .6rem; opacity: .8; transition: transform .25s ease; }
.season-picker.open .season-caret { transform: rotate(180deg); }

.season-menu {
  position: absolute; top: calc(100% + 7px); left: 50%;
  transform: translateX(-50%) translateY(-6px);
  min-width: 100%;
  background: rgba(255,255,255,.20);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.44); border-radius: 18px;
  padding: 5px; display: flex; flex-direction: column; gap: 2px;
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
}
.season-picker.open .season-menu {
  opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0);
}
.season-option {
  background: none; border: none; border-radius: 14px;
  padding: 8px 16px; white-space: nowrap; cursor: pointer;
  font-family: 'Trebuchet MS', sans-serif; font-size: .72rem;
  letter-spacing: .08em; color: rgba(255,255,255,.92);
  text-shadow: var(--counter-shadow); text-align: left;
}
.season-option[aria-selected="true"] { background: rgba(255,255,255,.26); }
.season-option:active { background: rgba(255,255,255,.34); }

/* ── Scene ────────────────────────────────────────── */
.scene {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  padding-top: 126px; /* header grew by the season picker row */
  padding-bottom: 60px;
  overflow: hidden;
}

/* ── Cards stage + slots ──────────────────────────── */
#tilt-wrap {
  position: relative;
  width: 305px; height: 415px;
  transform-style: preserve-3d;
}
#cardsStage {
  position: relative;
  width: 305px;
  height: 415px;
}

.card-slot {
  position: absolute;
  width: 305px; height: 415px;
  top: 0;
}
#slotLeft   { left: -330px; }
#slotCenter { left: 0; z-index: 1; }
#slotRight  { left: 330px; }

/* Entry animation — spring from below */
@keyframes card-rise {
  0%   { transform: translateY(220px) scale(0.82); opacity: 0; }
  65%  { transform: translateY(-14px) scale(1.03); opacity: 1; }
  82%  { transform: translateY(5px)   scale(0.99); }
  100% { transform: translateY(0)     scale(1);    opacity: 1; }
}
.card-slot.entering {
  animation: card-rise 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

/* Spinning rainbow border */
.sparkle-ring {
  position: absolute;
  inset: -3px;
  border-radius: 32px;
  background: var(--ring-gradient);
  z-index: 0;
  box-shadow: var(--ring-glow);
  transition: opacity 0.5s ease;
}

/* Flip perspective shell */
.flip-shell {
  position: absolute; inset: 0;
  z-index: 1;
  perspective: 1100px;
}

/* Flipper — rotates Y on reveal */
.flipper {
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.85s cubic-bezier(0.42, 0, 0.18, 1.1);
  border-radius: 28px;
  cursor: pointer;
}
.flipper.flipped {
  transform: rotateY(180deg);
  cursor: default;
}
.flipper:not(.flipped):active { transform: scale(0.96) translateY(2px); }

/* Bob — center card (ring + faces) floats together, paused while navigating */
.bob-host { position: absolute; inset: 0; }
.bob-wrap { width: 100%; height: 100%; border-radius: 28px; transform-style: preserve-3d; }
#slotCenter .bob-host { animation: bob 4s ease-in-out infinite; }
#cardsStage.navigating .bob-host,
#cardsStage.navigating .front-icon,
#cardsStage.navigating .shimmer-bar::after { animation-play-state: paused !important; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)} }

/* Card faces */
.face {
  position: absolute; inset: 0;
  border-radius: 28px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* ── Front face (unrevealed) ──────────────────────── */
.front {
  background: var(--card-front-bg);
  border: 1.5px solid rgba(255,255,255,.90);
  box-shadow: var(--card-shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
}

/* Shimmer sweep — diagonal white band */
.shimmer-bar {
  position: absolute; inset: 0;
  border-radius: 28px;
  pointer-events: none; z-index: 5; overflow: hidden;
}
.shimmer-bar::after {
  content: '';
  position: absolute;
  top: -100%; left: -70%;
  width: 45%; height: 300%;
  background: linear-gradient(
    105deg,
    transparent 0%,
    rgba(255,255,255,.06) 32%,
    rgba(255,255,255,.54) 50%,
    rgba(255,255,255,.06) 68%,
    transparent 100%
  );
  animation: shimmer-sweep 4s ease-in-out infinite;
}
@keyframes shimmer-sweep {
  0%, 10%   { transform: translateX(0);    opacity: 0; }
  14%        { opacity: 1; }
  58%        { transform: translateX(500%); opacity: 1; }
  65%, 100%  { transform: translateX(500%); opacity: 0; }
}

.front-label {
  font-family: 'Trebuchet MS', sans-serif;
  font-size: .68rem; letter-spacing: .28em; text-transform: uppercase;
  color: rgba(var(--label-rgb),.50);
}
.front-icon {
  font-size: 3.6rem; line-height: 1;
  filter: var(--icon-glow);
  animation: icon-pulse 3s ease-in-out infinite;
}
@keyframes icon-pulse {
  0%,100%{ transform: scale(1) rotate(-4deg); }
  50%    { transform: scale(1.15) rotate(4deg); }
}
.front-hint {
  font-size: .74rem; color: rgba(var(--label-rgb),.40);
  font-style: italic; letter-spacing: .04em;
}

/* ── Back face (revealed content) ─────────────────── */
.back {
  transform: rotateY(180deg);
  background: var(--card-back-bg);
  border: 1.5px solid rgba(255,255,255,.90);
  box-shadow: var(--card-shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 22px 20px 20px;
  gap: 9px;
}
.back-day {
  font-family: 'Trebuchet MS', sans-serif;
  font-size: .66rem; letter-spacing: .28em; text-transform: uppercase;
  color: rgba(var(--label-rgb),.52);
}
.back-emoji {
  font-size: 3.4rem; line-height: 1;
  animation: emoji-life 3s ease-in-out infinite;
}
@keyframes emoji-life {
  0%,100%{ transform: scale(1) rotate(0deg); }
  40%    { transform: scale(1.14) rotate(6deg); }
  70%    { transform: scale(.93) rotate(-4deg); }
}
.back-title {
  font-size: 1rem; color: var(--deep);
  text-align: center; font-style: italic; line-height: 1.35;
}
.back-gif {
  width: 88px; height: 110px;
  border-radius: 10px;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.7s ease;
  flex-shrink: 0;
}
.back-gif.loaded { opacity: 1; }
.back-msg {
  font-size: .74rem; color: var(--ink);
  line-height: 1.58; text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}


/* ── Day counter ─────────────────────────────────── */
.day-counter {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
  left: 50%; transform: translateX(-50%);
  z-index: 20;
  background: rgba(255,255,255,.18);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.44); border-radius: 50px;
  padding: 7px 20px;
  font-family: 'Trebuchet MS', sans-serif; font-size: .7rem;
  letter-spacing: .14em; color: rgba(255,255,255,.88);
  text-shadow: var(--counter-shadow); white-space: nowrap;
}

/* ── Krabbe (Maskottchen) ─────────────────────────
   Wohnt im Puckilander: läuft am unteren Rand, klettert auf die Karte, ist
   auch im Login da. pointer-events:none — sie darf Swipe und Kartentipp nie
   abfangen. JS setzt `transform` auf #crab, deshalb liegen alle CSS-
   Animationen auf Kindelementen (gleiche Regel wie bei #tilt-wrap). */
#crab {
  position: fixed; left: 0; bottom: 0;
  width: 44px; height: 32px;
  z-index: 25; pointer-events: none;
  will-change: transform;
}
#crab .crab-floor { /* misst die Safe-Area, damit sie nicht im Rand versinkt */
  position: absolute; bottom: 0; left: 0; width: 0;
  height: calc(env(safe-area-inset-bottom, 0px) + 6px);
}
.crab-sprite { width: 100%; height: 100%; transform-origin: 50% 100%; }
.crab-sprite.flip { transform: scaleX(-1); }
.crab-bob { width: 100%; height: 100%; }
#crab svg {
  width: 100%; height: 100%; display: block;
  shape-rendering: crispEdges;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.28));
}

/* Beine: zwei Stellungen, die sich beim Laufen abwechseln */
.crab-legs-b { opacity: 0; }
#crab.walking .crab-legs-a { animation: crab-legs .3s steps(1,end) infinite; }
#crab.walking .crab-legs-b { animation: crab-legs .3s steps(1,end) -.15s infinite; }
@keyframes crab-legs { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

#crab.walking .crab-bob { animation: crab-hop .3s steps(1,end) infinite; }
@keyframes crab-hop { 0%,49% { transform: translateY(0) } 50%,100% { transform: translateY(-2px) } }

.crab-claw-r { transform-box: fill-box; transform-origin: 50% 100%; }
#crab.waving .crab-claw-r { animation: crab-wave .44s ease-in-out 3; }
@keyframes crab-wave { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-28deg) } }

@media (prefers-reduced-motion: reduce) {
  #crab.walking .crab-legs-a, #crab.walking .crab-legs-b,
  #crab.walking .crab-bob, #crab.waving .crab-claw-r { animation: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  .sky, .cloud, .sparkle-ring,
  .front-icon, .back-emoji, .shimmer-bar::after { animation: none !important; }
}

/* ── Password overlay ─────────────────────────────────── */
#pw-overlay {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 24px;
  /* transparent so the .sky aurora behind shows — same background as the main UI */
  background: transparent;
  transition: opacity 0.6s ease;
}
/* While locked, hide the app foreground so only the aurora shows behind the login */
body.locked .header,
body.locked .scene,
body.locked .day-counter { visibility: hidden; }
#pw-overlay.hidden { opacity: 0; pointer-events: none; }
#pw-overlay .pw-title {
  font-family: Georgia, serif; font-size: 2rem; color: #fff;
  letter-spacing: .1em;
  text-shadow: var(--pw-title-glow);
}
#pw-overlay .pw-sub {
  font-family: 'Trebuchet MS', sans-serif; font-size: .75rem;
  color: rgba(255,255,255,.7); letter-spacing: .22em; text-transform: uppercase;
}
#pw-overlay .pw-box {
  background: rgba(255,255,255,.18);
  border: 1.5px solid rgba(255,255,255,.5);
  border-radius: 50px; padding: 14px 24px;
  display: flex; gap: 12px; align-items: center;
}
#pw-input {
  background: none; border: none; outline: none;
  font-family: 'Trebuchet MS', sans-serif; font-size: 1rem;
  color: #fff; letter-spacing: .08em; width: 180px;
}
#pw-input::placeholder { color: rgba(255,255,255,.45); }
#pw-btn {
  background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.5);
  border-radius: 50px; padding: 8px 18px;
  color: #fff; font-size: .8rem; letter-spacing: .12em;
  cursor: pointer; transition: background .2s;
}
#pw-btn:active { background: rgba(255,255,255,.4); }
#pw-error {
  font-family: 'Trebuchet MS', sans-serif; font-size: .72rem;
  color: var(--pw-error-color); letter-spacing: .1em;
  opacity: 0; transition: opacity .3s;
}
#pw-error.show { opacity: 1; }
</style>

  '🌸':'pink flowers cute aesthetic','🦋':'butterfly cute pastel','🍋':'lemon drink cute kawaii',
  '🌈':'rainbow colorful cute','💕':'pink hearts love cute',
  '🌙':'moon stars dreamy','⭐':'stars sparkle glitter',
  '🍀':'lucky clover cute','🦄':'unicorn rainbow cute',
  '🌺':'tropical flower pink cute','💫':'sparkle magic glitter',
  '🌷':'pink tulip flower cute','🎀':'pink bow ribbon cute',
  '🌊':'ocean waves soft pastel','✨':'glitter sparkle cute',
  '🍓':'strawberry cute kawaii','🌻':'sunflower cute happy',
  '💎':'diamond sparkle bling','🎶':'music notes dancing cute',

};

// ── Seasons ───────────────────────────────────────────────────────────────────
// Both seasons run on the same START_DATE and unlock rhythm.
// `legacyKeys` keeps season 1 on the original unprefixed storage keys so
// already-revealed cards and cached GIFs survive this change. Every other
// season gets its own namespace — otherwise card 5 of one season would inherit
// the reveal flag and GIF of card 5 of the other.
const SEASONS = [
  { id:'love',    label:'💌 Für dich', theme:'rose', themeColor:'#FF6EC7',
    legacyKeys:true, autoRevealPast:true,
    cards:CARDS_LOVE,    gifQueries:GIF_QUERIES_LOVE, gifFallback:'cute kawaii pink' },
  { id:'animals', label:'🦥 Tierwelt', theme:'jade', themeColor:'#3FC79A',
    cards:CARDS_ANIMALS, gifFallback:'cute animal nature' },
];
const SEASON_KEY  = 'puckilander_season';
let   currentSeason = SEASONS.find(s => s.id === localStorage.getItem(SEASON_KEY)) || SEASONS[0];

// ── Date setup ────────────────────────────────────────────────────────────────
const now     = new Date();
const elapsed = Math.floor((now - START_DATE) / 86400000);
// Per-season, because seasons may differ in length even on a shared rhythm.
function activeIdxFor(season) {
  return Math.min(Math.max(elapsed, 0), season.cards.length - 1);
}

const DAYS   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
document.getElementById('headerDate').textContent =
  `${DAYS[now.getDay()]}, ${now.getDate()}. ${MONTHS[now.getMonth()]}`;
const START_LABEL = `✨ Startet am ${START_DATE.getDate()}. ${MONTHS[START_DATE.getMonth()]}`;

// ── Carousel state ────────────────────────────────────────────────────────────
const stage      = document.getElementById('cardsStage');
const slotLeft   = document.getElementById('slotLeft');
const slotCenter = document.getElementById('slotCenter');
const slotRight  = document.getElementById('slotRight');
let   viewIdx    = activeIdxFor(currentSeason);
let   navigating = false;

function storeKey(season, i) {
  return season.legacyKeys ? `puckilander_revealed_${i}`
                           : `puckilander_${season.id}_revealed_${i}`;
}
function gifKey(season, i) {
  return season.legacyKeys ? `puckilander_gif_${i}`
                           : `puckilander_${season.id}_gif_${i}`;
}
// autoRevealPast: season 1 counts every past day as already seen, because its
// cards were lived through one per day. A season added later would otherwise
// arrive fully open — all its days are already in the past — so it opts out and
// every unlocked card stays face down until it is actually tapped.
function isRevealed(season, i) {
  if (season.autoRevealPast && i < activeIdxFor(season)) return true;
  return !!localStorage.getItem(storeKey(season, i));
}

// German "in N days" countdown for locked cards
const NUM = ['','einem','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn',
  'elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig',
  'einundzwanzig','zweiundzwanzig','dreiundzwanzig','vierundzwanzig','fünfundzwanzig',
  'sechsundzwanzig','siebenundzwanzig','achtundzwanzig','neunundzwanzig'];
function availIn(diff) {
  if (diff === 1) return 'In einem Tag verfügbar';
  return `In ${NUM[diff] || diff} Tagen verfügbar`;
}

// Build and fill one slot for a given card index
function fillSlot(slot, cardIdx) {
  slot.innerHTML = '';
  slot.classList.remove('revealed', 'entering');

  const season = currentSeason;
  if (cardIdx < 0 || cardIdx >= season.cards.length) {
    slot.style.visibility = 'hidden';
    return;
  }
  slot.style.visibility = '';

  const activeIdx = activeIdxFor(season);
  const card      = season.cards[cardIdx];
  const locked    = cardIdx > activeIdx;
  const revealed  = isRevealed(season, cardIdx);
  // Any unlocked card that is still face down can be opened — not just today's.
  // With autoRevealPast off, past cards are face down too and must stay tappable.
  const openable  = !locked && !revealed;

  if (revealed) slot.classList.add('revealed');

  // Bob host — floats ring + flip-shell together (only center card animates)
  const bobHost = document.createElement('div');   bobHost.className = 'bob-host';

  // Sparkle ring marks a card as still openable
  if (openable) {
    const ring = document.createElement('div');
    ring.className = 'sparkle-ring';
    bobHost.appendChild(ring);
  }

  // Flip shell
  const shell   = document.createElement('div');   shell.className = 'flip-shell';
  const flipper = document.createElement('div');   flipper.className = 'flipper' + (revealed ? ' flipped' : '');
  const bobWrap = document.createElement('div');   bobWrap.className = 'bob-wrap';

  // Front face
  const front = document.createElement('div');
  front.className = 'face front';
  if (locked) {
    front.innerHTML = `<div class="front-label">Tag ${cardIdx + 1}</div>
      <span class="front-icon" style="font-size:2.8rem">🔒</span>
      <div class="front-hint">${availIn(cardIdx - activeIdx)}</div>`;
  } else {
    front.innerHTML = `<div class="shimmer-bar"></div>
      <div class="front-label">Tag ${cardIdx + 1}</div>
      <span class="front-icon">✨</span>
      <div class="front-hint">Tippe um zu öffnen</div>`;
  }

  // Back face
  const back = document.createElement('div');
  back.className = 'face back';
  back.innerHTML = `<div class="back-day">Tag ${cardIdx + 1}</div>
    <span class="back-emoji">${card.emoji}</span>
    <img class="back-gif" alt="" loading="lazy">
    <div class="back-title">${card.title}</div>
    <p class="back-msg">${card.msg}</p>`;
  if (!locked) loadCardGif(season, cardIdx, back.querySelector('.back-gif'));

  bobWrap.append(front, back);
  flipper.appendChild(bobWrap);
  shell.appendChild(flipper);
  bobHost.appendChild(shell);
  slot.appendChild(bobHost);

  // Tap to reveal
  if (openable) {
    flipper.addEventListener('click', function() {
      localStorage.setItem(storeKey(season, cardIdx), '1');
      flipper.classList.add('flipped');
      slot.classList.add('revealed');
      const ring = slot.querySelector('.sparkle-ring');
      if (ring) ring.style.opacity = '0';
    });
  }
}

function renderView() {
  fillSlot(slotLeft,   viewIdx - 1);
  fillSlot(slotCenter, viewIdx);
  fillSlot(slotRight,  viewIdx + 1);
  document.getElementById('dayCounter').textContent =
    elapsed < 0 ? START_LABEL : `Tag ${viewIdx + 1} von ${currentSeason.cards.length}`;
}

function navigate(dir) {
  const next = viewIdx + dir;
  if (next < 0 || next >= currentSeason.cards.length || navigating) return;
  navigating = true;
  stage.classList.add('navigating');

  stage.style.transition = 'transform 0.42s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  stage.style.transform  = `translateX(${dir === 1 ? -330 : 330}px)`;

  setTimeout(() => {
    viewIdx = next;
    stage.style.transition = 'none';
    stage.style.transform  = '';
    renderView();
    stage.getBoundingClientRect();
    stage.style.transition = '';
    stage.classList.remove('navigating');
    navigating = false;
  }, 440);
}

// ── Klipy GIF per card ───────────────────────────────────────────────────────
const KLIPY_KEY = 'tb7vKsBjDQBtMLMD77FjB8RsakHHLZtDY9k64MaCqMIaqFPilvOfgyGjfVBXBryd';

async function loadCardGif(season, cardIdx, imgEl) {
  const card = season.cards[cardIdx];
  const cKey = gifKey(season, cardIdx);
  let url = localStorage.getItem(cKey);
  if (!url) {
    const query = card.gif || (season.gifQueries && season.gifQueries[card.emoji]) || season.gifFallback;
    try {
      const res  = await fetch(
        `https://api.klipy.com/v2/search?q=${encodeURIComponent(query)}&key=${KLIPY_KEY}&limit=3`,
      );
      const json = await res.json();
      const items = json.results || [];
      const item = items[cardIdx % items.length];
      url = item?.media_formats?.tinygif?.url
         || item?.media_formats?.gif?.url
         || item?.media_formats?.mp4?.url;
      if (url) localStorage.setItem(cKey, url);
    } catch(e) { return; }
  }
  if (url && imgEl) { imgEl.onload = () => imgEl.classList.add('loaded'); imgEl.src = url; }
}

// ── Season picker ────────────────────────────────────────────────────────────
const picker    = document.getElementById('seasonPicker');
const seasonBtn = document.getElementById('seasonBtn');
const seasonMenu = document.getElementById('seasonMenu');

function playEntry() {
  if (elapsed < 0) return;
  slotCenter.classList.remove('entering');
  void slotCenter.offsetWidth; // restart the animation
  slotCenter.classList.add('entering');
  setTimeout(() => slotCenter.classList.remove('entering'), 960);
}

function applySeason(id, { animate = true } = {}) {
  const season = SEASONS.find(s => s.id === id);
  if (!season) return;
  currentSeason = season;
  localStorage.setItem(SEASON_KEY, season.id);

  document.documentElement.dataset.season = season.theme;
  document.querySelector('meta[name="theme-color"]').content = season.themeColor;
  document.getElementById('seasonBtnLabel').textContent = season.label;
  seasonMenu.querySelectorAll('.season-option').forEach(opt => {
    opt.setAttribute('aria-selected', String(opt.dataset.id === season.id));
  });

  viewIdx = activeIdxFor(season);
  renderView();
  if (animate) playEntry();
}

function closeMenu() {
  picker.classList.remove('open');
  seasonBtn.setAttribute('aria-expanded', 'false');
}

SEASONS.forEach(season => {
  const opt = document.createElement('button');
  opt.className = 'season-option';
  opt.type = 'button';
  opt.setAttribute('role', 'option');
  opt.dataset.id = season.id;
  opt.textContent = season.label;
  opt.addEventListener('click', () => {
    closeMenu();
    if (season.id !== currentSeason.id) applySeason(season.id);
  });
  seasonMenu.appendChild(opt);
});

seasonBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = picker.classList.toggle('open');
  seasonBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => {
  if (!picker.contains(e.target)) closeMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

// ── Init ──────────────────────────────────────────────────────────────────────
applySeason(currentSeason.id, { animate: false });

// Entry animation on center slot (only when calendar is active)
playEntry();

// ── Swipe + tap side slots to navigate ───────────────────────────────────────
const scene = document.querySelector('.scene');
let tx0 = 0, dragging = false;

scene.addEventListener('touchstart', e => {
  tx0 = e.touches[0].clientX; dragging = false;
}, { passive: true });
scene.addEventListener('touchmove', e => {
  if (Math.abs(e.touches[0].clientX - tx0) > 8) dragging = true;
}, { passive: true });
scene.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx0;
  if (dragging && Math.abs(dx) > 40) navigate(dx < 0 ? 1 : -1);
});

slotLeft.addEventListener('click',  () => { if (!dragging) navigate(-1); });
slotRight.addEventListener('click', () => { if (!dragging) navigate(1); });

// ── 3D Tilt ───────────────────────────────────────────────────────────────────
(function() {
  const el  = document.getElementById('tilt-wrap');
  const MAX = 8;

  function tilt(rx, ry) {
    el.style.transition = 'transform 0.1s ease-out';
    el.style.transform  = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  }
  function reset() {
    el.style.transition = 'transform 0.5s ease-in-out';
    el.style.transform  = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
  }

  document.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect();
    const rx = ((e.clientY - (r.top + r.height / 2)) / (r.height / 2)) * -MAX;
    const ry = ((e.clientX - (r.left + r.width  / 2)) / (r.width  / 2)) *  MAX;
    tilt(Math.max(-MAX, Math.min(MAX, rx)), Math.max(-MAX, Math.min(MAX, ry)));
  });
  document.addEventListener('mouseleave', reset);
})();

// ── Password gate ─────────────────────────────────────────────────────────────
(async function() {
  // ponytail: change this hash to lock with a different password (SHA-256 lowercase hex)
  const PW_HASH = '59cea62bbdfb4dc0ccac8a9b92f35bf8b4d96762871626956217907c09fc035b';
  const overlay = document.getElementById('pw-overlay');
  const input   = document.getElementById('pw-input');
  const errEl   = document.getElementById('pw-error');

  if (sessionStorage.getItem('puckilander_unlocked')) {
    overlay.style.display = 'none';
    return;
  }
  document.body.classList.add('locked');

  async function checkPw() {
    const buf  = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input.value));
    const hex  = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    if (hex === PW_HASH) {
      sessionStorage.setItem('puckilander_unlocked', '1');
      document.body.classList.remove('locked');
      overlay.classList.add('hidden');
      setTimeout(() => overlay.remove(), 660);
    } else {
      errEl.classList.add('show');
      input.value = '';
      setTimeout(() => errEl.classList.remove('show'), 2000);
    }
  }

  document.getElementById('pw-btn').addEventListener('click', checkPw);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
})();

// ── Krabbe ────────────────────────────────────────────────────────────────────
// Ein kleines Wesen, das im Puckilander wohnt. Es entscheidet selbst, ob es am
// unteren Rand entlangläuft, auf die Karte klettert oder eine Pause macht.
(function() {
  const el = document.getElementById('crab');
  if (!el) return;

  // Pixel-Sprite: ein Zeichen = ein Pixel. Zum Ändern einfach das Raster
  // umzeichnen — Breite aller Zeilen muss gleich bleiben.
  const ART = [
    'c.........c',
    'cc.......cc',
    '.c.hhhhh.c.',
    '..bEbbbEb..',
    '.bbbbbbbbb.',
    '.bbbbbbbbb.',
    '..ddddddd..',
  ];
  const LEGS_A = '.l.l...l.l.';
  const LEGS_B = 'l..l...l..l';
  const COL = { E:'#2A1710', h:'#F2996A', b:'#E8814F', d:'#CE6C3E', c:'#D2673B', l:'#B85433' };
  const COLS = ART[0].length, ROWS = ART.length + 1;

  const px = (x, y, ch) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${COL[ch]}"/>`;
  const legRow = row => [...row].map((ch, x) => ch === 'l' ? px(x, ART.length, ch) : '').join('');

  const body = [], clawL = [], clawR = [];
  ART.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    if (ch === 'c') (x < COLS / 2 ? clawL : clawR).push(px(x, y, ch));
    else body.push(px(x, y, ch));
  }));

  el.querySelector('.crab-bob').innerHTML =
    `<svg viewBox="0 0 ${COLS} ${ROWS}" xmlns="http://www.w3.org/2000/svg">` +
    `<g class="crab-legs-a">${legRow(LEGS_A)}</g>` +
    `<g class="crab-legs-b">${legRow(LEGS_B)}</g>` +
    `<g class="crab-claw-l">${clawL.join('')}</g>` +
    `<g class="crab-claw-r">${clawR.join('')}</g>` +
    `<g class="crab-body">${body.join('')}</g></svg>`;

  const sprite = el.querySelector('.crab-sprite');
  const probe  = el.querySelector('.crab-floor');
  const WIDTH  = el.offsetWidth;
  const WALK   = 34;   // px/s seitwärts
  const CLIMB  = 105;  // px/s hoch und runter

  const vw = () => window.innerWidth;
  const vh = () => window.innerHeight;
  const floorY = () => probe.offsetHeight;
  const rand = (a, b) => a + Math.random() * (b - a);
  const spanX = (min, max) => rand(min, Math.max(min, max));

  // Die Karte ist nur ein Ziel, wenn sie wirklich sichtbar ist — im Login und
  // während des Season-Wechsels gibt es nichts, worauf man klettern könnte.
  function cardRect() {
    if (document.body.classList.contains('locked')) return null;
    const f = document.querySelector('#slotCenter .flip-shell');
    if (!f) return null;
    const r = f.getBoundingClientRect();
    return r.width > 0 && r.top > 40 && r.top < vh() - 40 ? r : null;
  }

  let x = rand(30, 140), yAbs = 0, dir = 1;
  let targetX = x, state = 'idle', until = 0, level = 'floor';

  function setState(s, ms) { state = s; until = performance.now() + (ms || 0); }
  function wave() {
    el.classList.remove('waving'); void el.offsetWidth; el.classList.add('waving');
    setTimeout(() => el.classList.remove('waving'), 1400);
  }

  function nextAction() {
    const r = cardRect();
    const roll = Math.random();
    if (level === 'card' && r) {
      if (roll < 0.30)      { level = 'floor'; targetX = spanX(8, vw() - WIDTH - 8); state = 'walk'; }
      else if (roll < 0.62) { setState('idle', rand(1200, 3800)); if (Math.random() < 0.6) wave(); }
      else                  { targetX = spanX(r.left + 6, r.right - WIDTH - 6); state = 'walk'; }
    } else {
      level = 'floor';
      if (r && roll < 0.22)  { level = 'card'; targetX = spanX(r.left + 6, r.right - WIDTH - 6); state = 'walk'; }
      else if (roll < 0.48)  { setState('idle', rand(900, 3200)); if (Math.random() < 0.5) wave(); }
      else                   { targetX = spanX(8, vw() - WIDTH - 8); state = 'walk'; }
    }
  }

  let last = 0;
  function frame(t) {
    const dt = Math.min((t - last) / 1000, 0.05); // nach Tab-Wechsel nicht springen
    last = t;

    const r = cardRect();
    if (level === 'card' && !r) { level = 'floor'; setState('idle', 400); }
    const targetY = level === 'card' && r ? vh() - r.top : floorY();

    const dy = targetY - yAbs;
    yAbs += Math.sign(dy) * Math.min(Math.abs(dy), CLIMB * dt);

    if (state === 'walk') {
      const dx = targetX - x;
      if (Math.abs(dx) > 1) {
        dir = Math.sign(dx);
        x += dir * Math.min(Math.abs(dx), WALK * dt);
      } else if (Math.abs(dy) < 1) {
        setState('idle', rand(500, 1900));
      }
    } else if (t > until) {
      nextAction();
    }

    x = Math.max(2, Math.min(x, vw() - WIDTH - 2));
    el.classList.toggle('walking', state === 'walk' && Math.abs(targetX - x) > 1);
    sprite.classList.toggle('flip', dir < 0);
    el.style.transform = `translate3d(${x.toFixed(1)}px, ${(-yAbs).toFixed(1)}px, 0)`;

    raf = requestAnimationFrame(frame);
  }

  let raf = 0;
  function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function stop()  { cancelAnimationFrame(raf); raf = 0; }

  yAbs = floorY();
  el.style.transform = `translate3d(${x}px, ${-yAbs}px, 0)`;

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; // sitzt einfach da
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  start();
})();

// ── Floating sparkles ─────────────────────────────────────────────────────────
(function() {
  const cont = document.getElementById('sparkles');
  const syms = ['✦','⋆','✧','·','✦','⋆'];
  for (let i = 0; i < 28; i++) {
    const el  = document.createElement('span');
    const sym = Math.random() > .5, sz = 2 + Math.random() * 4;
    el.style.cssText = [
      'position:absolute',
      `left:${Math.random()*100}%`, `top:${5+Math.random()*88}%`,
      sym
        ? `font-size:${7+Math.random()*9}px;color:rgba(255,255,255,${.45+Math.random()*.55})`
        : `width:${sz}px;height:${sz}px;background:rgba(255,255,255,.85);border-radius:50%`,
      `animation:rise ${3.5+Math.random()*5}s ${-(Math.random()*14)}s ease-in-out infinite`,
      'opacity:0','line-height:1','pointer-events:none',
    ].join(';');
    if (sym) el.textContent = syms[Math.floor(Math.random()*syms.length)];
    cont.appendChild(el);
  }
})();
</script>
